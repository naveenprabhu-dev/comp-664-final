# =============================================================================
# WARNING: UNVERIFIED ON LONGLEAF (as of 2026-11-11).
# This file is a best-guess and has never been run on the cluster. Before
# building any training code on top of it, run cluster/CHECKLIST.md Step 6
# on an interactive GPU node:
#     python -c "import torch; print(torch.cuda.is_available())"
#     python -c "import bitsandbytes"
# If either fails, re-pin pytorch-cuda (and possibly bitsandbytes) to match
# the node's CUDA version from `nvidia-smi` / `module avail cuda`.
# =============================================================================
#
# Heavy, CUDA/Longleaf-specific training environment.
# Kept separate from the repo-root requirements.txt (portable, data-only).
# Create with:  conda env create -f cluster/env/environment.yml
#
# NOTE: pin CUDA/torch versions to whatever the Longleaf GPU nodes support.
# bitsandbytes is required for QLoRA (4-bit) and needs a matching CUDA build.
name: orderbias
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytorch
  - pytorch-cuda=12.1
  - pip:
      # portable core deps
      - datasets>=2.18
      - huggingface_hub>=0.23
      - requests>=2.31
      - PyYAML>=6.0
      # fine-tuning stack (TODOs #4-#6)
      - transformers>=4.44
      - peft>=0.12
      - accelerate>=0.33
      - bitsandbytes>=0.43
      - trl>=0.9
      # analysis (TODO #8)
      - numpy
      - pandas
      - matplotlib
